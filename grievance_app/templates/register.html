<!DOCTYPE html>
<html>
<head>
    <title>Register - AI Grievance System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: Arial, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 540px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        }

        .icon {
            text-align: center;
            font-size: 60px;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8, #22c55e, #facc15);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #e5e7eb;
            margin-bottom: 30px;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            margin-top: 5px;
        }

        .btn-custom {
            border-radius: 25px;
            font-weight: 700;
            padding: 12px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            color: #22c55e;
        }

        .error-box {
            background: rgba(239,68,68,0.2);
            color: white;
            border: 1px solid #ef4444;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .helptext {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 4px;
        }

        ul {
            color: #fca5a5;
            font-size: 13px;
            padding-left: 18px;
        }

        @media (max-width: 768px) {
            .register-card {
                margin: 15px;
                padding: 25px;
            }

            .title {
                font-size: 28px;
            }

            .icon {
                font-size: 50px;
            }
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="icon">
        📝
    </div>

    <h1 class="title">
        Create Account
    </h1>

    <p class="subtitle">
        Register to submit and track your complaints
    </p>

    <form method="POST">
        {% csrf_token %}

        {% if form.errors %}
            <div class="error-box">
                {{ form.errors }}
            </div>
        {% endif %}

        <div class="mb-3">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="mb-3">
            <label>Email</label>
            {{ form.email }}
        </div>

        <div class="mb-3">
            <label>Password</label>
            {{ form.password1 }}
        </div>

        <div class="mb-3">
            <label>Confirm Password</label>
            {{ form.password2 }}
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-custom">
            Register
        </button>
    </form>

    <div class="login-link">
        Already have an account?
        <a href="/login/">Login here</a>
    </div>

    <a href="/" class="btn btn-light w-100 mt-3 btn-custom">
        Back Home
    </a>

</div>

</body>
</html>
