<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Submit Complaint
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f4f4f4;
        }

        .box{
            margin-top:60px;
            background:white;
            padding:40px;
            border-radius:20px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box shadow">

        <h2 class="text-center text-success mb-4">

            Submit Grievance

        </h2>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit"
                    class="btn btn-success w-100">

                Submit Complaint

            </button>

        </form>

    </div>

</div>

</body>
</html>
