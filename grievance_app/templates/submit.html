<!DOCTYPE html>
<html>
<head>
    <title>Submit Complaint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-5">

        <h2 class="text-center mb-4">Submit Grievance</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="button"
                    onclick="startVoiceTyping()"
                    class="btn btn-info w-100 mb-3">
                Start Voice Complaint
            </button>

            <button type="button"
                    onclick="getLocation()"
                    class="btn btn-warning w-100 mb-3">
                Get Live Location
            </button>

            <button type="submit"
                    class="btn btn-success w-100">
                Submit Complaint
            </button>

        </form>

    </div>
</div>

<script>
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            document.getElementById("id_latitude").value = position.coords.latitude;
            document.getElementById("id_longitude").value = position.coords.longitude;
            alert("Location captured successfully!");
        });
    } else {
        alert("Location not supported by this browser.");
    }
}

function startVoiceTyping() {
    var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice typing is not supported in this browser. Please use Google Chrome.");
        return;
    }

    var recognition = new SpeechRecognition();

    recognition.lang = "hi-IN";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();

    recognition.onresult = function(event) {
        var voiceText = event.results[0][0].transcript;

        var complaintBox = document.getElementById("id_complaint");

        complaintBox.value = complaintBox.value + " " + voiceText;

        alert("Voice complaint added successfully!");
    };

    recognition.onerror = function(event) {
        alert("Voice error: " + event.error);
    };
}
</script>

</body>
</html>
